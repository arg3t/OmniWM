name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.OMNIWM_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.OMNIWM_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keychain="$RUNNER_TEMP/omniwm-signing.keychain-db"
          certificate="$RUNNER_TEMP/omniwm-signing.p12"
          printf '%s' "$CERTIFICATE" | base64 -D >"$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"
          security default-keychain -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)"/\1/p')"
          test -n "$identity"
          echo "OMNIWM_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Fetch GhosttyKit
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p Frameworks
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/GhosttyKit.xcframework.zip" \
            "https://github.com/BarutSRB/OmniWM/releases/download/v$version/GhosttyKit.xcframework-v$version.zip"
          ditto -x -k "$RUNNER_TEMP/GhosttyKit.xcframework.zip" Frameworks

      - name: Build and sign app
        run: ./Scripts/package-app.sh release dev

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/OmniWM-v$version.zip"
          ditto -c -k --keepParent dist/OmniWM.app "$archive"
          gh release create "$GITHUB_REF_NAME" "$archive" --generate-notes
