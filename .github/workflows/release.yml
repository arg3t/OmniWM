name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      GHOSTTYKIT_VERSION: 0.6.4
    steps:
      - uses: actions/checkout@v7

      - name: Install Swift 6.4
        run: |
          toolchain="$RUNNER_TEMP/swift-6.4"
          mkdir -p "$toolchain"
          curl --fail --location --retry 3 \
            --output "$toolchain/swift.pkg" \
            "https://download.swift.org/swift-6.4.x-branch/xcode/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-28-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-28-a-osx.pkg"
          cd "$toolchain"
          xar -xf swift.pkg
          gzip -dc swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-28-a-osx-package.pkg/Payload | cpio -idm
          "$toolchain/usr/bin/swift" --version
          echo "$toolchain/usr/bin" >>"$GITHUB_PATH"

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.OMNIWM_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.OMNIWM_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keychain="$RUNNER_TEMP/omniwm-signing.keychain-db"
          certificate="$RUNNER_TEMP/omniwm-signing.p12"
          printf '%s' "$CERTIFICATE" | base64 -D >"$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"
          security default-keychain -s "$keychain"
          identity="$(security find-certificate -c 'OmniWM Local CI' -Z "$keychain" | sed -n 's/^SHA-1 hash: //p')"
          test -n "$identity"
          echo "OMNIWM_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Fetch GhosttyKit
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p Frameworks
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/GhosttyKit.xcframework.zip" \
            "https://github.com/BarutSRB/OmniWM/releases/download/v$GHOSTTYKIT_VERSION/GhosttyKit.xcframework-v$GHOSTTYKIT_VERSION.zip"
          ditto -x -k "$RUNNER_TEMP/GhosttyKit.xcframework.zip" Frameworks

      - name: Build and sign app
        run: |
          ./Scripts/package-app.sh release false
          app="dist/OmniWM.app"
          codesign --force --options runtime --sign "$OMNIWM_SIGNING_IDENTITY" "$app/Contents/MacOS/omniwmctl"
          codesign --force --options runtime --entitlements OmniWM.entitlements --sign "$OMNIWM_SIGNING_IDENTITY" "$app/Contents/MacOS/OmniWM"
          codesign --force --options runtime --entitlements OmniWM.entitlements --sign "$OMNIWM_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/OmniWM-v$version.zip"
          ditto -c -k --keepParent dist/OmniWM.app "$archive"
          gh release create "$GITHUB_REF_NAME" "$archive" --generate-notes
